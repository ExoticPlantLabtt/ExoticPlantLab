<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Exotic Plant Lab</title>
<style>
:root{
  --bg:#07110a;--card:#0e1d11;--hdr:#0f2218;--border:#1a3320;
  --gold:#c8a84b;--gold2:#e8c870;--text:#e8e4dc;--muted:#6a8a6a;
  --dim:#2e4a2e;--green:#1a3a25;--mid:#2e5339;
  --red:#c04040;--redbg:#1a0808;--amber:#c89030;--amberbg:#1a1200;
  --ok:#40a860;--okbg:#081a0e;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;min-height:100vh;-webkit-tap-highlight-color:transparent}
/* HEADER */
header{background:var(--hdr);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:50}
.logo-wrap{display:flex;align-items:center;gap:8px;flex-shrink:0}
.logo-img{width:42px;height:42px;border-radius:50%;object-fit:contain;background:#000;border:1.5px solid var(--gold)}
.brand-name{font-size:13px;font-weight:800;color:#fff;letter-spacing:1px;line-height:1}
.brand-name span{color:#7ab844}
.brand-sub{font-size:8px;color:var(--muted);letter-spacing:.5px}
.hdr-right{display:flex;align-items:center;gap:8px;margin-left:auto}
.search-wrap{position:relative}
.search-wrap input{padding:7px 10px 7px 28px;background:var(--bg);border:1px solid var(--border);border-radius:18px;color:var(--text);font-size:12px;width:140px;outline:none}
.search-wrap input:focus{border-color:var(--gold)}
.search-wrap input::placeholder{color:var(--dim)}
.search-icon{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--dim);font-size:12px;pointer-events:none}
.cart-btn{background:var(--gold);border:none;border-radius:16px;padding:6px 12px;color:#07110a;font-weight:700;font-size:12px;cursor:pointer;white-space:nowrap}
.admin-btn{background:none;border:1px solid var(--border);border-radius:7px;padding:6px 10px;color:var(--muted);cursor:pointer;font-size:11px}
.admin-btn:hover{border-color:var(--gold);color:var(--gold)}
/* FILTERS */
.fbar{background:var(--card);border-bottom:1px solid var(--border);padding:8px 16px;display:flex;align-items:center;gap:6px;overflow-x:auto;scrollbar-width:none}
.fbar::-webkit-scrollbar{display:none}
.pill{padding:4px 12px;border-radius:16px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:11px;cursor:pointer;white-space:nowrap;flex-shrink:0}
.pill.on{background:var(--gold);border-color:var(--gold);color:#07110a;font-weight:600}
.stk-tog{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted);cursor:pointer;margin-left:auto;white-space:nowrap;flex-shrink:0}
.stk-tog input{accent-color:var(--gold)}
/* MAIN */
main{padding:14px 14px 80px}
.res-lbl{font-size:11px;color:var(--dim);margin-bottom:12px}
/* CART PANEL */
.cart-panel{background:var(--card);border:1px solid var(--gold);border-radius:12px;padding:13px;margin-bottom:16px}
.cp-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.cp-title{font-size:12px;font-weight:700;color:var(--gold);letter-spacing:.5px}
.cp-clear{background:none;border:none;color:var(--dim);cursor:pointer;font-size:11px}
.cp-item{display:flex;align-items:center;gap:6px;padding:5px 0;border-bottom:.5px solid var(--border);font-size:12px}
.cp-name{flex:1;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cp-qty{color:var(--muted);font-size:11px;white-space:nowrap}
.cp-price{color:var(--gold);font-weight:600;white-space:nowrap}
.cp-rm{background:none;border:none;color:var(--dim);cursor:pointer;font-size:14px;padding:0 2px}
.cp-total-row{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding-top:8px;border-top:1px solid var(--border)}
/* WHATSAPP BUTTON */
.wa-btn{width:100%;margin-top:10px;padding:12px;background:#25D366;border:none;border-radius:10px;color:#fff;font-weight:700;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;letter-spacing:.3px}
.wa-btn:hover{background:#1ea952}
.wa-icon{font-size:18px}
/* GRID */
.plant-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:11px}
/* CARD */
.plant-card{background:var(--card);border-radius:11px;border:1px solid var(--border);overflow:hidden;display:flex;flex-direction:column;transition:border-color .2s}
.plant-card:hover{border-color:var(--mid)}
.plant-card.in-cart{border-color:var(--gold)}
.plant-card.sold-out{opacity:.5}
.card-img{width:100%;height:110px;object-fit:cover;display:block;background:var(--bg)}
.card-img-ph{width:100%;height:110px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:linear-gradient(135deg,#071008,#0e1d11)}
.card-img-ph span:first-child{font-size:36px;line-height:1}
.card-img-ph span:last-child{font-size:8px;color:var(--dim);letter-spacing:.5px}
.card-body{padding:10px;display:flex;flex-direction:column;gap:5px;flex:1}
.card-id{font-size:9px;color:var(--gold);font-family:monospace;font-weight:600}
.card-name{font-size:12px;font-weight:600;color:var(--text);line-height:1.3;min-height:30px}
.card-prices{display:flex;align-items:baseline;gap:5px}
.card-price{font-size:17px;font-weight:700;color:var(--gold)}
.card-base{font-size:10px;color:var(--dim);text-decoration:line-through}
.card-foot{display:flex;justify-content:space-between;align-items:center;margin-top:2px}
.stk-badge{font-size:10px;font-weight:600;padding:2px 7px;border-radius:16px}
.add-btn{width:28px;height:28px;border-radius:50%;border:none;cursor:pointer;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.add-btn.can{background:var(--mid);color:var(--gold)}
.add-btn.can:hover{background:var(--gold);color:#07110a}
.add-btn.done{background:var(--gold);color:#07110a}
.add-btn:disabled{background:var(--border);color:var(--dim);cursor:default}
.empty-msg{text-align:center;padding:40px 0;color:var(--dim);font-size:13px}
/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:200;display:flex;align-items:flex-start;justify-content:center;padding:14px;overflow-y:auto}
.modal{background:var(--card);border:1px solid var(--border);border-radius:14px;width:100%;max-width:640px;display:flex;flex-direction:column;max-height:88vh;overflow:hidden;margin:auto}
.modal-hdr{background:var(--hdr);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);flex-shrink:0}
.modal-hdr h2{font-size:13px;font-weight:700;color:var(--gold);letter-spacing:.5px}
.modal-close{background:none;border:none;color:var(--muted);cursor:pointer;font-size:19px;line-height:1}
/* LOCK */
.lock-body{padding:36px;display:flex;flex-direction:column;align-items:center;gap:13px}
.lock-body label{font-size:13px;color:var(--muted)}
.lock-body input{padding:9px 14px;background:var(--bg);border:1.5px solid var(--border);border-radius:8px;color:var(--text);font-size:14px;width:210px;text-align:center;outline:none}
.lock-body input:focus{border-color:var(--gold)}
.lock-body input.err{border-color:var(--red)}
.lock-err{color:var(--red);font-size:12px;min-height:15px;text-align:center}
.lock-body button{padding:9px 28px;background:var(--gold);border:none;border-radius:8px;color:#07110a;font-weight:700;cursor:pointer;font-size:13px}
/* ADMIN TABS */
.admin-tabs{display:flex;border-bottom:1px solid var(--border);flex-shrink:0}
.admin-tab{flex:1;padding:9px;background:none;border:none;color:var(--muted);cursor:pointer;font-size:12px;border-bottom:2px solid transparent}
.admin-tab.on{color:var(--gold);border-bottom-color:var(--gold)}
/* ADMIN TABLE */
.admin-sbar{padding:8px 14px;border-bottom:1px solid var(--border);display:flex;gap:7px;flex-shrink:0}
.admin-sbar input{flex:1;padding:6px 9px;background:var(--bg);border:1px solid var(--border);border-radius:7px;color:var(--text);font-size:12px;outline:none}
.sv-btn{padding:6px 15px;background:var(--gold);border:none;border-radius:7px;color:#07110a;font-weight:700;cursor:pointer;font-size:12px;white-space:nowrap}
.sv-btn.saved{background:#3a8040;color:#fff}
.tbl-hdr{display:grid;grid-template-columns:60px 1fr 65px 65px 46px 42px;gap:4px;padding:6px 14px;background:var(--bg);border-bottom:1px solid var(--border);flex-shrink:0}
.tbl-hdr span{font-size:9px;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:.5px}
.tbl-rows{overflow-y:auto;flex:1}
.tbl-row{display:grid;grid-template-columns:60px 1fr 65px 65px 46px 42px;gap:4px;padding:5px 14px;align-items:center;border-bottom:.5px solid var(--bg)}
.tbl-row:nth-child(even){background:#0a1a0c}
.tbl-row.changed{background:#1a1600}
.tbl-id{font-size:9px;font-family:monospace;color:var(--gold);font-weight:600}
.ti{font-size:11px;padding:3px 5px;border-radius:5px;border:1px solid var(--border);background:var(--bg);color:var(--text);width:100%;outline:none}
.tn{font-size:11px;font-weight:600;padding:3px 4px;border-radius:5px;border:1px solid var(--border);background:var(--bg);width:100%;outline:none}
.ti:focus,.tn:focus{border-color:var(--gold)}
.img-ph-btn{width:34px;height:34px;border-radius:5px;border:1px dashed var(--border);background:var(--bg);color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:10px}
.img-th{width:34px;height:34px;border-radius:5px;object-fit:cover;border:1px solid var(--border);cursor:pointer;display:block}
.admin-foot{padding:8px 14px;border-top:1px solid var(--border);flex-shrink:0;display:flex;justify-content:space-between;align-items:center}
.admin-foot-note{font-size:10px;color:var(--dim)}
/* IMG EDITOR */
.img-editor{padding:18px;display:flex;flex-direction:column;gap:12px;overflow-y:auto}
.img-ed-name{font-size:13px;font-weight:600;color:var(--gold)}
.img-ed-label{font-size:11px;color:var(--muted)}
.img-ed-input{padding:8px 10px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:12px;outline:none;font-family:monospace}
.img-ed-input:focus{border-color:var(--gold)}
.img-preview-box{width:100%;height:160px;object-fit:cover;border-radius:9px;border:1px solid var(--border)}
.img-tip{font-size:11px;color:var(--dim);line-height:1.5;background:var(--bg);border-radius:7px;padding:9px 11px;border:1px solid var(--border)}
.img-actions{display:flex;gap:7px}
.img-save{flex:1;padding:9px;background:var(--gold);border:none;border-radius:8px;color:#07110a;font-weight:700;cursor:pointer;font-size:13px}
.img-rm{padding:9px 12px;background:none;border:1px solid var(--red);border-radius:8px;color:var(--red);cursor:pointer;font-size:12px}
.img-back{padding:9px 12px;background:none;border:1px solid var(--border);border-radius:8px;color:var(--muted);cursor:pointer;font-size:12px}
/* PHOTOS GRID */
.photos-wrap{padding:12px;display:grid;grid-template-columns:1fr 1fr;gap:8px;overflow-y:auto}
.photo-card{background:var(--bg);border:1px solid var(--border);border-radius:8px;overflow:hidden;cursor:pointer}
.photo-card:hover{border-color:var(--gold)}
.photo-card img{width:100%;height:65px;object-fit:cover;display:block}
.photo-card-ph{width:100%;height:65px;display:flex;align-items:center;justify-content:center;font-size:24px;background:var(--card)}
.photo-card-info{padding:5px 7px}
.photo-card-id{font-size:8px;color:var(--gold);font-family:monospace}
.photo-card-name{font-size:9px;color:var(--text);line-height:1.3;margin-top:1px}
/* WHATSAPP SETTINGS */
.wa-settings{padding:18px;display:flex;flex-direction:column;gap:14px;overflow-y:auto}
.wa-setting-label{font-size:11px;color:var(--muted);margin-bottom:4px}
.wa-setting-input{padding:9px 12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:13px;outline:none;width:100%}
.wa-setting-input:focus{border-color:var(--gold)}
.wa-save-btn{padding:10px;background:var(--gold);border:none;border-radius:8px;color:#07110a;font-weight:700;cursor:pointer;font-size:13px}
.wa-save-btn.saved{background:#3a8040;color:#fff}
.wa-preview{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:11px;color:var(--muted);line-height:1.6;font-family:monospace}
/* LOADING */
.loading{text-align:center;padding:40px;color:var(--muted);font-size:13px}
</style>
</head>

</div>

<main>

    </div>
    <div id="cp-items"></div>
    <div class="cp-total-row">

    </div>
    <button class="wa-btn" onclick="sendToWhatsApp()">

  <div class="res-lbl" id="res-lbl"></div>
  <div class="plant-grid" id="grid"></div>
  <div class="empty-msg" id="empty" style="display:none">No plants found.</div>
</main>

<div class="overlay" id="modal" style="display:none" onclick="overlayClick(event)">
  <div class="modal">
    <div class="modal-hdr">
      <h2 id="modal-title">Admin</h2>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div id="modal-body" style="display:flex;flex-direction:column;overflow:hidden;max-height:80vh"></div>
  </div>
</div>

// ── STATE ───────────────────────────────────────────────────────
var plants = JSON.parse(JSON.stringify(DEFAULT_PLANTS));
var cart = {}, genus = "All", stockOnly = true, adminUnlocked = false;
var pendingEdits = {}, adminView = "catalog", imgEditId = null;
var WA_NUMBER = "18684304943";
var WA_MSG_HEADER = "Hello! I'd like to order the following plants from Exotic Plant Lab:";
var db = null, dbReady = false;

// load from localStorage fallback
(function(){
  try {
    var s = localStorage.getItem("epl_v3");
    if(s){ var d=JSON.parse(s); plants=d.plants||plants; WA_NUMBER=d.wa||WA_NUMBER; }
  }catch(e){}
})();

function persist(){
  try{ localStorage.setItem("epl_v3", JSON.stringify({plants:plants,wa:WA_NUMBER})); }catch(e){}
  // also save to db if available
  if(db){
    db.doc("settings/plants").set({data: JSON.stringify(plants)}).catch(function(){});
    db.doc("settings/config").set({wa: WA_NUMBER}).catch(function(){});
  }
}

// ── DB INIT ─────────────────────────────────────────────────────
(async function(){
  try {
    if(!window.claude) return;
    db = await claude.use("db");
    if(!db) return;
    // load plants from db
    var pdoc = await db.doc("settings/plants").get().catch(function(){return null;});
    if(pdoc && pdoc.data){ plants = JSON.parse(pdoc.data); }
    var cdoc = await db.doc("settings/config").get().catch(function(){return null;});
    if(cdoc && cdoc.wa){ WA_NUMBER = cdoc.wa; }
    dbReady = true;
    render();
  }catch(e){ render(); }
})();

// ── HELPERS ─────────────────────────────────────────────────────
function si(n){
  if(n===0)return{c:"var(--red)",bg:"var(--redbg)",l:"Sold out"};
  if(n<=2)return{c:"var(--amber)",bg:"var(--amberbg)",l:"Low: "+n};
  return{c:"var(--ok)",bg:"var(--okbg)",l:"In stock: "+n};
}
function tQty(){ return Object.keys(cart).reduce(function(s,k){return s+cart[k].qty;},0); }
function tVal(){ return Object.keys(cart).reduce(function(s,k){return s+cart[k].price*cart[k].qty;},0); }

// ── RENDER ──────────────────────────────────────────────────────
function render(){
  var q = document.getElementById("srch").value.toLowerCase();
  var f = plants.filter(function(p){
    if(genus!=="All"&&p.g!==genus)return false;
    if(stockOnly&&p.stock===0)return false;
    if(q&&p.name.toLowerCase().indexOf(q)===-1&&p.id.toLowerCase().indexOf(q)===-1)return false;
    return true;
  });
  var inS = plants.filter(function(p){return p.stock>0;}).length;
  document.getElementById("res-lbl").textContent = f.length+" "+(f.length===1?"variety":"varieties")+"  ·  "+inS+" in stock";
  var grid=document.getElementById("grid"), empty=document.getElementById("empty");
  if(!f.length){grid.innerHTML="";empty.style.display="block";renderCart();return;}
  empty.style.display="none";
  grid.innerHTML = f.map(function(p){
    var info=si(p.stock), inC=!!cart[p.id], sold=p.stock===0;
    var imgH = p.img
      ? '<img class="card-img" src="'+p.img+'" alt="'+p.name+'" onerror="this.outerHTML=\'<div class=&quot;card-img-ph&quot;><span>'+p.em+'</span><span>'+p.g.toUpperCase()+'</span></div>\'">'
      : '<div class="card-img-ph"><span>'+p.em+'</span><span>'+p.g.toUpperCase()+'</span></div>';
    return '<div class="plant-card'+(inC?" in-cart":"")+(sold?" sold-out":"")+'">'+
      imgH+
      '<div class="card-body">'+
        '<div class="card-id">'+p.id+'</div>'+
        '<div class="card-name">'+p.name+'</div>'+
        '<div class="card-prices"><span class="card-price">TTD $'+p.price+'</span>'+(p.base&&p.base!==p.price?'<span class="card-base">$'+p.base+'</span>':'')+
        '</div>'+
        '<div class="card-foot">'+
          '<span class="stk-badge" style="color:'+info.c+';background:'+info.bg+'">'+info.l+'</span>'+
          '<button class="add-btn '+(inC?"done":sold?"":"can")+'"'+(sold?" disabled":' onclick="addC(\''+p.id+'\')"')+'>'+
            (inC?"✓":"+")+
          '</button>'+
        '</div>'+
      '</div>'+
    '</div>';
  }).join("");
  renderCart();
}

// ── CART ────────────────────────────────────────────────────────
function addC(id){
  var p=plants.find(function(x){return x.id===id;});
  if(!p||p.stock===0)return;
  if(cart[id]){if(cart[id].qty>=p.stock)return;cart[id].qty++;}
  else cart[id]={name:p.name,price:p.price,qty:1};
  render();
}
function renderCart(){
  var keys=Object.keys(cart), btn=document.getElementById("cart-btn"), panel=document.getElementById("cart-panel");
  if(!keys.length){btn.style.display="none";panel.style.display="none";return;}
  var qty=tQty(), total=tVal();
  btn.style.display="block"; btn.textContent="🛒 "+qty;
  panel.style.display="block";
  document.getElementById("cp-title").textContent="WISHLIST · "+qty+" PLANT"+(qty>1?"S":"");
  document.getElementById("cp-total").textContent="TTD $"+total.toLocaleString();
  document.getElementById("cp-items").innerHTML=keys.map(function(k){
    var c=cart[k];
    return '<div class="cp-item"><span class="cp-name">'+c.name+'</span><span class="cp-qty">×'+c.qty+'</span><span class="cp-price">TTD $'+(c.price*c.qty).toLocaleString()+'</span><button class="cp-rm" onclick="rmC(\''+k+'\')">✕</button></div>';
  }).join("");
}
function rmC(id){delete cart[id];render();}
function clearCart(){cart={};render();}
function scrollToCart(){document.getElementById("cart-panel").scrollIntoView({behavior:"smooth"});}

function sendToWhatsApp(){
  var keys=Object.keys(cart);
  if(!keys.length)return;
  var lines=keys.map(function(k){return"• "+cart[k].name+" ×"+cart[k].qty+" = TTD $"+(cart[k].price*cart[k].qty).toLocaleString();}).join("\n");
  var total=tVal();
  var msg=WA_MSG_HEADER+"\n\n"+lines+"\n\n*Total: TTD $"+total.toLocaleString()+"*\n\nPlease confirm availability and payment details. Thank you! 🌿";
  var url="https://wa.me/"+WA_NUMBER+"?text="+encodeURIComponent(msg);
  window.open(url,"_blank");
}

// ── MODAL ───────────────────────────────────────────────────────
function openModal(){document.getElementById("modal").style.display="flex";if(adminUnlocked)showAdminTabs();else showLock();}
function closeModal(){document.getElementById("modal").style.display="none";pendingEdits={};imgEditId=null;}
function overlayClick(e){if(e.target===document.getElementById("modal"))closeModal();}

function showLock(){
  document.getElementById("modal-title").textContent="Admin Access";
  document.getElementById("modal-body").innerHTML=
    '<div class="lock-body"><div style="font-size:34px">🔒</div><label>Enter admin password</label>'+
    '<input type="password" id="pf" placeholder="Password" onkeydown="if(event.key===\'Enter\')tryL()">'+
    '<div class="lock-err" id="le"></div><button onclick="tryL()">Enter</button></div>';
  setTimeout(function(){var e=document.getElementById("pf");if(e)e.focus();},60);
}
function tryL(){
  var v=(document.getElementById("pf")||{}).value||"";
  if(v==="EPL2026"){adminUnlocked=true;showAdminTabs();}
  else{var i=document.getElementById("pf"),e=document.getElementById("le");if(i){i.classList.add("err");i.value="";}if(e)e.textContent="Wrong password.";}
}

// ── ADMIN TABS ──────────────────────────────────────────────────
function showAdminTabs(){
  document.getElementById("modal-title").textContent="Admin";
  document.getElementById("modal-body").innerHTML=
    '<div class="admin-tabs">'+
      '<button class="admin-tab'+(adminView==="catalog"?" on":"")+'" onclick="switchTab(\'catalog\')">Catalog</button>'+
      '<button class="admin-tab'+(adminView==="photos"?" on":"")+'" onclick="switchTab(\'photos\')">Photos</button>'+
      '<button class="admin-tab'+(adminView==="whatsapp"?" on":"")+'" onclick="switchTab(\'whatsapp\')">WhatsApp</button>'+
    '</div>'+
    '<div id="tab-content" style="display:flex;flex-direction:column;overflow:hidden;flex:1"></div>';
  if(adminView==="catalog")renderCatalogTab();
  else if(adminView==="photos")renderPhotosTab();
  else renderWATab();
}
function switchTab(v){adminView=v;pendingEdits={};showAdminTabs();}

// ── CATALOG TAB ─────────────────────────────────────────────────
function renderCatalogTab(){
  var rows=plants.map(function(p,i){
    var ed=pendingEdits[p.id]||{};
    var nm=ed.name!==undefined?ed.name:p.name;
    var pr=ed.price!==undefined?ed.price:p.price;
    var bs=ed.base!==undefined?ed.base:p.base;
    var st=ed.stock!==undefined?ed.stock:p.stock;
    var dirty=Object.keys(ed).length>0;
    var sc=Number(st)===0?"var(--red)":Number(st)<=2?"var(--amber)":"var(--ok)";
    var imgEl=p.img
      ?'<img class="img-th" src="'+p.img+'" onclick="openImgEdit(\''+p.id+'\')" onerror="this.outerHTML=\'<div class=&quot;img-ph-btn&quot; onclick=&quot;openImgEdit(\\&quot;'+p.id+'\\&quot;)&quot;>📷</div>\'">'
      :'<div class="img-ph-btn" onclick="openImgEdit(\''+p.id+'\')">📷</div>';
    return '<div class="tbl-row'+(dirty?" changed":"")+'" style="'+(dirty?"background:#1a1600":i%2===0?"":"background:#0a1a0c")+'">'+
      '<div class="tbl-id">'+p.id+'</div>'+
      '<input class="ti" value="'+nm.replace(/"/g,"&quot;")+'" onchange="ep(\''+p.id+'\',\'name\',this.value)">'+
      '<input class="tn" type="number" min="0" value="'+pr+'" style="color:var(--gold)" onchange="ep(\''+p.id+'\',\'price\',this.value)">'+
      '<input class="tn" type="number" min="0" value="'+bs+'" style="color:var(--dim)" onchange="ep(\''+p.id+'\',\'base\',this.value)">'+
      '<input class="tn" type="number" min="0" value="'+st+'" style="color:'+sc+'" onchange="ep(\''+p.id+'\',\'stock\',this.value)">'+
      imgEl+
    '</div>';
  }).join("");
  document.getElementById("tab-content").innerHTML=
    '<div class="admin-sbar"><input type="text" placeholder="Search..." oninput="filterRows(this.value)"><button class="sv-btn" id="sbtn" onclick="saveAdmin()">Save all</button></div>'+
    '<div class="tbl-hdr"><span>ID</span><span>Name</span><span>Sale $</span><span>Base $</span><span>Stock</span><span>Pic</span></div>'+
    '<div class="tbl-rows" id="tbl-rows">'+rows+'</div>'+
    '<div class="admin-foot"><span class="admin-foot-note" id="chg-note">No unsaved changes</span><button class="sv-btn" onclick="saveAdmin()">Save all</button></div>';
}
function ep(id,f,v){
  if(!pendingEdits[id])pendingEdits[id]={};pendingEdits[id][f]=v;
  var n=Object.keys(pendingEdits).length, el=document.getElementById("chg-note");
  if(el)el.textContent=n+" unsaved change"+(n>1?"s":"");
}
function filterRows(q){
  document.querySelectorAll(".tbl-row").forEach(function(r){
    var id=(r.querySelector(".tbl-id")||{}).textContent||"";
    var nm=(r.querySelector(".ti")||{}).value||"";
    r.style.display=(!q||id.toLowerCase().indexOf(q.toLowerCase())!==-1||nm.toLowerCase().indexOf(q.toLowerCase())!==-1)?"grid":"none";
  });
}
function saveAdmin(){
  plants.forEach(function(p){
    var ed=pendingEdits[p.id];if(!ed)return;
    if(ed.name!==undefined)p.name=ed.name;
    if(ed.price!==undefined)p.price=Math.max(0,Number(ed.price));
    if(ed.base!==undefined)p.base=Math.max(0,Number(ed.base));
    if(ed.stock!==undefined)p.stock=Math.max(0,Number(ed.stock));
  });
  Object.keys(cart).forEach(function(id){
    var p=plants.find(function(x){return x.id===id;});
    if(!p||p.stock===0){delete cart[id];return;}
    cart[id].price=p.price;cart[id].name=p.name;
    if(cart[id].qty>p.stock)cart[id].qty=p.stock;
  });
  persist(); pendingEdits={};
  var btn=document.getElementById("sbtn");
  if(btn){btn.textContent="✓ Saved!";btn.classList.add("saved");setTimeout(function(){btn.textContent="Save all";btn.classList.remove("saved");},2000);}
  renderCatalogTab();render();
}

// ── PHOTOS TAB ──────────────────────────────────────────────────
function renderPhotosTab(){
  var cards=plants.map(function(p){
    var imgEl=p.img
      ?'<img src="'+p.img+'" style="width:100%;height:65px;object-fit:cover;display:block" onerror="this.style.display=\'none\'">'
      :'<div class="photo-card-ph">'+p.em+'</div>';
    return '<div class="photo-card" onclick="openImgEdit(\''+p.id+'\')">'+
      imgEl+
      '<div class="photo-card-info"><div class="photo-card-id">'+p.id+(p.img?" ✓":"")+'</div><div class="photo-card-name">'+p.name+'</div></div>'+
    '</div>';
  }).join("");
  document.getElementById("tab-content").innerHTML=
    '<div style="padding:10px 14px;border-bottom:1px solid var(--border);font-size:11px;color:var(--muted);flex-shrink:0">Tap any plant to add or change its photo</div>'+
    '<div class="photos-wrap">'+cards+'</div>';
}

// ── IMG EDITOR ──────────────────────────────────────────────────
function openImgEdit(id){
  imgEditId=id;
  var p=plants.find(function(x){return x.id===id;});if(!p)return;
  document.getElementById("modal-title").textContent="Photo: "+p.name;
  document.getElementById("modal-body").innerHTML=
    '<div class="img-editor">'+
      '<div class="img-ed-name">'+p.id+' — '+p.name+'</div>'+
      (p.img?'<img class="img-preview-box" id="img-prev" src="'+p.img+'" alt="Photo">':'<div id="img-prev-ph" style="width:100%;height:130px;background:var(--bg);border-radius:9px;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:48px">'+p.em+'</div>')+
      '<label class="img-ed-label">Paste a photo URL</label>'+
      '<input class="img-ed-input" type="url" id="img-url" placeholder="https://i.imgur.com/example.jpg" value="'+(p.img||"")+'" oninput="prevImg()">'+
      '<div class="img-tip">💡 Right-click any plant photo online → <b>Copy image address</b> → paste here. Or upload to imgur.com and copy the direct link.</div>'+
      '<div class="img-actions">'+
        '<button class="img-save" onclick="saveImg()">Save photo</button>'+
        (p.img?'<button class="img-rm" onclick="removeImg()">Remove</button>':'')+
        '<button class="img-back" onclick="backToAdmin()">← Back</button>'+
      '</div>'+
    '</div>';
}
function prevImg(){
  var url=(document.getElementById("img-url")||{}).value||"";
  var ph=document.getElementById("img-prev-ph");
  var prev=document.getElementById("img-prev");
  if(url){
    if(ph)ph.style.display="none";
    if(prev){prev.src=url;prev.style.display="block";}
    else{
      var img=document.createElement("img");img.id="img-prev";img.className="img-preview-box";img.src=url;img.alt="Preview";
      var ed=document.querySelector(".img-editor");
      if(ed&&ed.children[1])ed.insertBefore(img,ed.children[1]);
    }
  }
}
function saveImg(){
  var url=((document.getElementById("img-url")||{}).value||"").trim();
  var p=plants.find(function(x){return x.id===imgEditId;});
  if(p){p.img=url;persist();render();}
  backToAdmin();
}
function removeImg(){
  var p=plants.find(function(x){return x.id===imgEditId;});
  if(p){p.img="";persist();render();}
  backToAdmin();
}
function backToAdmin(){
  imgEditId=null;
  document.getElementById("modal-title").textContent="Admin";
  document.getElementById("modal-body").innerHTML=
    '<div class="admin-tabs">'+
      '<button class="admin-tab'+(adminView==="catalog"?" on":"")+'" onclick="switchTab(\'catalog\')">Catalog</button>'+
      '<button class="admin-tab'+(adminView==="photos"?" on":"")+'" onclick="switchTab(\'photos\')">Photos</button>'+
      '<button class="admin-tab'+(adminView==="whatsapp"?" on":"")+'" onclick="switchTab(\'whatsapp\')">WhatsApp</button>'+
    '</div>'+
    '<div id="tab-content" style="display:flex;flex-direction:column;overflow:hidden;flex:1"></div>';
  if(adminView==="catalog")renderCatalogTab();
  else if(adminView==="photos")renderPhotosTab();
  else renderWATab();
}

// ── WHATSAPP TAB ────────────────────────────────────────────────
function renderWATab(){
  var previewMsg=WA_MSG_HEADER+"\n\n• Alocasia Infernalis ×1 = TTD $70\n• Anthurium Black Magic ×2 = TTD $360\n\n*Total: TTD $430*\n\nPlease confirm availability and payment details. Thank you! 🌿";
  document.getElementById("tab-content").innerHTML=
    '<div class="wa-settings">'+
      '<div>'+
        '<div class="wa-setting-label">WhatsApp number (with country code, no + or spaces)</div>'+
        '<input class="wa-setting-input" type="tel" id="wa-num" value="'+WA_NUMBER+'" placeholder="e.g. 18684304943">'+
      '</div>'+
      '<div>'+
        '<div class="wa-setting-label">Message header (first line of order message)</div>'+
        '<input class="wa-setting-input" type="text" id="wa-hdr" value="'+WA_MSG_HEADER+'" placeholder="Hello! I\'d like to order...">'+
      '</div>'+
      '<button class="wa-save-btn" id="wa-save-btn" onclick="saveWA()">Save WhatsApp settings</button>'+
      '<div class="wa-setting-label">Preview of order message customers will send:</div>'+
      '<div class="wa-preview">'+previewMsg+'</div>'+
    '</div>';
}
function saveWA(){
  var num=(document.getElementById("wa-num")||{}).value||"";
  var hdr=(document.getElementById("wa-hdr")||{}).value||"";
  WA_NUMBER=num.replace(/\D/g,"");
  WA_MSG_HEADER=hdr;
  persist();
  var btn=document.getElementById("wa-save-btn");
  if(btn){btn.textContent="✓ Saved!";btn.classList.add("saved");setTimeout(function(){btn.textContent="Save WhatsApp settings";btn.classList.remove("saved");},2000);}
}

// ── EVENTS ──────────────────────────────────────────────────────
document.getElementById("admin-btn").addEventListener("click",openModal);
document.getElementById("srch").addEventListener("input",render);
document.getElementById("stk").addEventListener("change",function(){stockOnly=this.checked;render();});
document.querySelectorAll(".pill").forEach(function(btn){
  btn.addEventListener("click",function(){
    document.querySelectorAll(".pill").forEach(function(b){b.classList.remove("on");});
    this.classList.add("on");genus=this.dataset.g;render();
  });
});
render();
</script>
